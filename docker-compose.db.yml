services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: oczki
      POSTGRES_PASSWORD: oczki
      POSTGRES_DB: oczki
    volumes:
      - oczki_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oczki -d oczki']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oczki_postgres_data:
